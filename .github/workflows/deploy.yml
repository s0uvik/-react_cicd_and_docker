name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-Deploy:
    runs-on: ubuntu-latest

    steps:
      #1. get the latest code
      - name: Checkout code
        uses: action/checkout@v4

      #2. Login to docker hub
      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      #3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{secrets.DOCKERHUB_USERNAME}}/react-app:latest
            -t ${{ secrets.DOCKERHUB_USERNAME }}/react-app:${{ github.sha }} \ .

      #4. Push image to DOcker hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest docker push ${{ secrets.DOCKERHUB_USERNAME }}/react-app:${{ github.sha }}

      #5. Deploy to vps
