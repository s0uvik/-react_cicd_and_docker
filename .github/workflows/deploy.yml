name: Deploy Frontend

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: react-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # The `secrets` context is not available in a step-level `if`, so mirror the
    # one we branch on into `env`, which is.
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      #1. get the latest code
      - name: Checkout code
        uses: actions/checkout@v4

      #2. gate the build on lint + typecheck
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      #3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      #4. Build and push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      #5. Deploy to VPS
      # Required secrets: VPS_HOST, VPS_USER, VPS_PASSWORD.
      # Optional secrets: VPS_PORT (default 22), VPS_APP_DIR (default ~/react-app).
      # The whole deploy is skipped until VPS_HOST is set.
      - name: Copy compose file to VPS
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ secrets.VPS_APP_DIR || 'react-app' }}

      - name: Deploy to VPS
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,APP_DIR
          script: |
            set -euo pipefail
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Compose reads these from .env next to docker-compose.prod.yml.
            printf 'DOCKERHUB_USERNAME=%s\nIMAGE_TAG=%s\n' \
              "$DOCKERHUB_USERNAME" "$IMAGE_TAG" > .env

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout
            docker image prune -f
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || 'react-app' }}
