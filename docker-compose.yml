# Local development/verification only. Production uses docker-compose.prod.yml.
services:
  frontend:
    build: .
    container_name: react-app
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
